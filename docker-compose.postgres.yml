name: fluentforge-postgres

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluentforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-fluentforge}"
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: migrate
    image: fluentforge-migrate:local
    environment:
      RUNTIME_BACKEND: postgres
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fluentforge}
      MIGRATIONS_DIR: /app/drizzle/migrations
      RUNTIME_BOOTSTRAP_SQL: /app/drizzle/bootstrap/postgres-runtime.sql
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-fluentforge}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      PGRST_SERVER_PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  processing-service:
    build:
      context: ./processing-service
    image: fluentforge-processing:local
    environment:
      PROCESSING_DB_PATH: /data/processing.db
      PROCESSING_SHARED_SECRET: ${PROCESSING_SHARED_SECRET:?PROCESSING_SHARED_SECRET is required}
      PROCESSING_ALLOWED_SOURCE_HOSTS: app
      PROCESSING_MAX_SOURCE_BYTES: ${PROCESSING_MAX_SOURCE_BYTES:-1073741824}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
      WHISPER_MODEL_CACHE: /models/whisper
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LOCAL_FILES_ONLY: ${WHISPER_LOCAL_FILES_ONLY:-false}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
    volumes:
      - processing-data:/data
      - whisper-models:/models/whisper
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  app:
    build:
      context: .
      target: runtime
      args:
        VITE_RUNTIME_BACKEND: postgres
    image: fluentforge-app-postgres:local
    environment:
      RUNTIME_BACKEND: postgres
      POSTGREST_URL: http://postgrest:3000
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_STORAGE_SECRET: ${APP_STORAGE_SECRET:?APP_STORAGE_SECRET is required}
      LOCAL_STORAGE_ROOT: /data/storage
      RUNTIME_INTERNAL_URL: http://app:3000
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN is required}
      PROCESSING_SERVICE_URL: http://processing-service:8001
      PROCESSING_SHARED_SECRET: ${PROCESSING_SHARED_SECRET:?PROCESSING_SHARED_SECRET is required}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
      AI_LOCAL_MODEL: ${AI_LOCAL_MODEL:-}
      AI_LOCAL_API_KEY: ${AI_LOCAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - app-storage:/data/storage
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
      processing-service:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  app-storage:
  processing-data:
  whisper-models:
