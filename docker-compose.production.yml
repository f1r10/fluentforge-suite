name: fluentforge

services:
  app:
    build:
      context: .
      target: runtime
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required}
    image: fluentforge-app:local
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN is required}
      PROCESSING_SERVICE_URL: http://processing-service:8001
      PROCESSING_SHARED_SECRET: ${PROCESSING_SHARED_SECRET:?PROCESSING_SHARED_SECRET is required}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      processing-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  processing-service:
    build:
      context: ./processing-service
    image: fluentforge-processing:local
    env_file:
      - .env.production
    environment:
      PROCESSING_DB_PATH: /data/processing.db
      PROCESSING_SHARED_SECRET: ${PROCESSING_SHARED_SECRET:?PROCESSING_SHARED_SECRET is required}
      PROCESSING_ALLOWED_SOURCE_HOSTS: ${PROCESSING_ALLOWED_SOURCE_HOSTS:?PROCESSING_ALLOWED_SOURCE_HOSTS is required}
      WHISPER_MODEL_CACHE: /models/whisper
    volumes:
      - processing-data:/data
      - whisper-models:/models/whisper
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    profiles:
      - migrate
    build:
      context: .
      target: migrate
    image: fluentforge-migrate:local
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATIONS_DIR: /app/drizzle/migrations
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  processing-data:
  whisper-models:
